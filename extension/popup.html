<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  body {
    width: 280px;
    margin: 0;
    padding: 14px 16px;
    font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif;
    font-size: 13px;
    color: #2c2c2a;
    line-height: 1.6;
  }
  h1 { font-size: 14px; font-weight: 500; margin: 0 0 10px; }
  .status { font-size: 12px; padding: 8px 10px; border-radius: 8px; background: #f1f0ec; margin-bottom: 12px; }
  .status.ok { background: #e1f5ee; color: #0f6e56; }
  .status.bad { background: #fcebeb; color: #a32d2d; }
  label { display: block; font-size: 12px; color: #6b6b66; margin-bottom: 4px; }
  input {
    width: 100%; box-sizing: border-box; padding: 6px 9px; font-size: 12px;
    border: 1px solid #e2e1dc; border-radius: 8px; font-family: inherit; margin-bottom: 8px;
  }
  button {
    width: 100%; padding: 7px 10px; font-size: 12px; cursor: pointer;
    border: 1px solid #185fa5; background: #185fa5; color: #fff; border-radius: 8px;
    font-family: inherit;
  }
  .hint { color: #6b6b66; font-size: 11px; margin: 10px 0 0; }
</style>
</head>
<body>
  <h1>求职助手</h1>
  <div class="status" id="status">检查中…</div>

  <label for="base">后端地址</label>
  <input id="base" placeholder="http://127.0.0.1:8000">
  <button id="save">保存并重新检查</button>

  <label for="inject" style="margin-top:12px">面板没出现时</label>
  <button id="inject" style="background:#fff;color:#185fa5">在当前页显示面板</button>

  <p class="hint">打开 Boss/猎聘/智联的岗位页或搜索列表页，右下角会出现「求」按钮。列表页支持批量抓取，但只抓到卡片摘要。</p>

  <script src="popup.js"></script>
</body>
</html>
